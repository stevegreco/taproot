# yaml-language-server: $schema=../../../src/schema/knowledge-record.schema.json
id: component.text-field
type: component
title: Text field
summary: Use Text field to collect a single line of text with a label, hint, and error.
tags:
  - form
  - input
links:
  related:
    - component.badge
sources:
  - title: Token tier consumption (tokens ADR 0003)
    url: packages/tokens/docs/adr/0003-token-tier-consumption.md
description: >-
  Collects one line of text and associates a label, optional hint, and optional error with the
  control.
usage:
  do:
    - Collect a short value such as a name, email, or search query.
    - Pair with Button when the value should be submitted.
  avoid:
    - situation: Collect multi-line text.
      instead: component.text-area
      why: Text field is a single line.
    - situation: Choose from a known set of options.
      instead: component.select
      why: Text field does not present choices.
    - situation: Trigger an action by itself.
      instead: component.button
      why: Text field collects a value.
anatomy:
  field:
    role: container
    description: Label, control, hint, and error stacked together.
  label:
    role: label
    description: Visible name for the value.
  control:
    role: interactive-surface
    description: Single-line text control.
  hint:
    role: description
    description: Optional supporting guidance.
  error:
    role: description
    description: Optional message that says what to fix.
parameters:
  label:
    kind: string
    description: Visible label. This is the accessible name.
  hint:
    kind: string
    description: Supporting guidance. Included in the accessible description when set.
  error:
    kind: string
    description: >-
      What to fix. A non-empty value marks the control invalid and is included in the accessible
      description.
  type:
    kind: enum
    values:
      text: Plain single-line text.
      email: Email address.
      password: Concealed secret.
      search: Search query.
      url: Web address.
      tel: Telephone number.
    default: text
  name:
    kind: string
    description: Form field name. The value is submitted under this name.
  value:
    kind: string
    description: Current value. The attribute sets the initial value.
  placeholder:
    kind: string
    description: Example text shown when the value is empty. Not a replacement for the label.
  autocomplete:
    kind: string
    description: Hint for the browser autofill, such as email.
  disabled:
    kind: boolean
    default: false
    description: Prevents editing. A disabled field does not submit its value.
  required:
    kind: boolean
    default: false
    description: The value must be provided before submit. Conveyed by more than color.
events:
  input: The value changed while editing.
  change: The value was committed.
states:
  - disabled
  - invalid
  - hover
  - focus
  - default
rules:
  - id: visible-label
    level: must
    topic: content
    statement: Provide a visible label that names the value. Placeholder text is not a label.
    examples:
      do:
        - Email address
        - Team name
      avoid:
        - Enter email
  - id: hint-adds-guidance
    level: should
    topic: content
    statement: Use a hint for format or purpose that the label does not already state.
  - id: error-says-what-to-fix
    level: must
    topic: content
    statement: Write the error as what to fix.
    examples:
      do:
        - Enter an email address with an @ sign.
      avoid:
        - Invalid
  - id: error-marks-invalid
    level: must
    topic: behavior
    statement: A non-empty error marks the control invalid, and clearing the error removes that state.
  - id: error-blocks-submit
    level: must
    topic: behavior
    statement: While a non-empty error is set, the control blocks its form from submitting.
  - id: disabled-blocks-editing
    level: must
    topic: behavior
    statement: Disabled prevents editing.
  - id: form-value
    level: should
    topic: behavior
    statement: The value participates in form submit and reset when the host supports form association.
    applicability: Hosts that implement form association.
  - id: a11y-visible-label
    level: must
    topic: accessibility
    statement: The field has a visible label, and that label is the accessible name. Placeholder text is not.
  - id: a11y-described-by
    level: must
    topic: accessibility
    statement: Hint and error are associated so assistive technology can describe the field.
  - id: a11y-invalid-message
    level: must
    topic: accessibility
    statement: Invalid state includes a text message. Meaning does not depend on color alone.
  - id: a11y-required
    level: must
    topic: accessibility
    statement: Required is announced and is not conveyed by color alone.
  - id: a11y-visible-focus
    level: must
    topic: accessibility
    statement: Keyboard focus remains visibly indicated.
accessibility:
  role: Text input
  name: Required from the visible label.
  keyboard:
    Tab: Move focus to or from the field.
    Printable characters: Insert text.
tokens:
  field:
    base:
      gap: primitives.space.1
  label:
    base:
      foreground: semantic.color.foreground.default
      font-family: semantic.typography.label.default.fontFamily
      font-size: semantic.typography.label.default.fontSize
      font-weight: semantic.typography.label.default.fontWeight
      line-height: semantic.typography.label.default.lineHeight
      letter-spacing: semantic.typography.label.default.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  control:
    base:
      background: semantic.color.background.surface
      foreground: semantic.color.foreground.default
      border: semantic.color.border.default
      radius: semantic.radius.control
      padding-horizontal: primitives.space.3
      padding-vertical: primitives.space.2
      font-family: semantic.typography.body.default.fontFamily
      font-size: semantic.typography.body.default.fontSize
      font-weight: semantic.typography.body.default.fontWeight
      line-height: semantic.typography.body.default.lineHeight
      letter-spacing: semantic.typography.body.default.letterSpacing
    hover:
      border: semantic.color.border.strong
    focus:
      focus-ring: semantic.color.border.focus
    disabled:
      background: semantic.color.background.disabled
      foreground: semantic.color.foreground.disabled
      border: semantic.color.border.disabled
    invalid:
      border: semantic.color.border.status.danger.default
  hint:
    base:
      foreground: semantic.color.foreground.muted
      font-family: semantic.typography.body.small.fontFamily
      font-size: semantic.typography.body.small.fontSize
      font-weight: semantic.typography.body.small.fontWeight
      line-height: semantic.typography.body.small.lineHeight
      letter-spacing: semantic.typography.body.small.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  error:
    base:
      foreground: semantic.color.foreground.status.danger.default
      font-family: semantic.typography.body.small.fontFamily
      font-size: semantic.typography.body.small.fontSize
      font-weight: semantic.typography.body.small.fontWeight
      line-height: semantic.typography.body.small.lineHeight
      letter-spacing: semantic.typography.body.small.letterSpacing
rationale:
  - decision: Text field consumes semantic tokens directly.
    why: >-
      ADR 0003. Focus, invalid, disabled, surface, and text already have semantic roles. No
      component-token namespace.
  - decision: Invalid is a state driven by the error message.
    why: >-
      The message is the accessible signal. A variant axis would hide that the state comes from the
      error.
  - decision: Label, hint, and error belong to the field.
    why: >-
      A separate field shell does not exist yet. Association stays on this control until that shell
      lands.
