# yaml-language-server: $schema=../../../src/schema/knowledge-record.schema.json
id: component.button
type: component
title: Button
summary: Use Button to trigger an action or to submit or reset a form.
tags:
  - action
  - form
related:
  - component.badge
  - component.link
sources:
  - kind: token-source
    path: packages/tokens/src/tokens/components/button.tokens.json
  - kind: adr
    path: packages/tokens/docs/adr/0003-token-tier-consumption.md
tokenRef:
  tier: component
  namespace: component.button
  description: All visual values consume the published Button component-token contract.
contract:
  description: Triggers an action or submits or resets a form.
  usage:
    do:
      - situation: Trigger an action in the current view.
      - situation: Submit or reset a form.
    avoid:
      - situation: Navigate to another location.
        instead: Link
        why: Links provide native navigation semantics.
      - situation: Display status or metadata.
        instead: Badge
        why: Button communicates an available action.
  content:
    - id: label-describes-result
      level: must
      statement: Use a concise label that describes the result.
      examples:
        do:
          - Save changes
          - Delete account
        avoid:
          - Click here
    - id: danger-for-destructive
      level: must
      statement: Use the danger variant only for destructive or difficult-to-reverse actions.
    - id: explain-disabled
      level: should
      statement: When the context does not say why an action is disabled, say why near it.
    - id: follow-action-hierarchy
      level: should
      statement: Apply the action hierarchy pattern when several actions appear together.
      references:
        - id: pattern.action-hierarchy
          fragment: assign-emphasis
  anatomy:
    - name: control
      role: interactive-surface
      description: Interactive control.
    - name: content
      role: label
      description: Action label with an optional decorative icon.
  parameters:
    variant:
      kind: enum
      values:
        primary: Highest-emphasis action.
        secondary: Supporting action.
        ghost: Low-emphasis action.
        danger: Destructive or difficult-to-reverse action.
      examples:
        primary: Save changes
        secondary: Cancel
        ghost: View details
        danger: Delete project
      default: primary
    size:
      kind: enum
      values:
        sm: Small button.
        md: Medium button.
      default: md
    action:
      kind: enum
      values:
        activate: Triggers an action.
        submit: Submits the associated form.
        reset: Resets the associated form.
      default: activate
    disabled:
      kind: boolean
      default: false
    fullWidth:
      kind: boolean
      default: false
      description: Fills the available inline size.
    accessibleName:
      kind: string
      description: Accessible name when visible content is insufficient.
  configurationAxes:
    reducedMotion:
      values:
        - reduce
  events:
    activate:
      description: Requests the action represented by the button.
  states:
    - disabled
    - pressed
    - hover
    - focus
    - default
  behavior:
    - id: disabled-prevents-activation
      level: must
      statement: Disabled prevents activation.
    - id: explicit-form-action
      level: should
      statement: In a form, set action to submit or reset when the button should submit or reset. The default activate does neither.
    - id: form-association
      level: should
      statement: Submit and reset participate in a form when the host supports form association.
      applicability: Hosts that implement form association.
  accessibility:
    semantics: Button.
    name: Required from visible content or accessibleName.
    keyboard:
      - key: Tab
        action: Move focus to or from the button.
      - key: Enter
        action: Activate.
      - key: Space
        action: Activate.
    requirements:
      - id: a11y-visible-focus
        level: must
        statement: Keyboard focus remains visibly indicated.
      - id: a11y-icon-accessible-name
        level: must
        statement: Icon-only buttons have an accessible name.
      - id: a11y-not-color-alone
        level: must
        statement: Meaning does not depend on color alone.
  rationale:
    - decision: Button has a published component-token namespace.
      rationale: Consumers need a stable customization boundary for variants and states.
  visuals:
    control:
      base:
        radius: component.button.radius
        gap: component.button.gap
        font-family: component.button.font.family
        font-size: component.button.font.size
        font-weight: component.button.font.weight
        line-height: component.button.font.lineHeight
        letter-spacing: component.button.font.letterSpacing
        motion-duration: component.button.motion.duration
        motion-easing: component.button.motion.easing
      states:
        focus:
          focus-ring: component.button.focus.border
      size:
        md:
          padding-horizontal: component.button.size.medium.paddingInline
          padding-vertical: component.button.size.medium.paddingBlock
        sm:
          padding-horizontal: component.button.size.small.paddingInline
          padding-vertical: component.button.size.small.paddingBlock
      variant:
        primary:
          background: component.button.primary.background.default
          foreground: component.button.primary.foreground.default
          border: component.button.primary.border.default
          states:
            hover:
              background: component.button.primary.background.hover
              border: component.button.primary.border.hover
            pressed:
              background: component.button.primary.background.pressed
              border: component.button.primary.border.pressed
            disabled:
              background: component.button.primary.background.disabled
              foreground: component.button.primary.foreground.disabled
              border: component.button.primary.border.disabled
        secondary:
          background: component.button.secondary.background.default
          foreground: component.button.secondary.foreground.default
          border: component.button.secondary.border.default
          states:
            hover:
              background: component.button.secondary.background.hover
            pressed:
              background: component.button.secondary.background.pressed
            disabled:
              background: transparent
              foreground: component.button.secondary.foreground.disabled
              border: component.button.secondary.border.disabled
        ghost:
          background: transparent
          foreground: component.button.ghost.foreground.default
          border: transparent
          states:
            hover:
              background: component.button.ghost.background.hover
            pressed:
              background: component.button.ghost.background.pressed
            disabled:
              background: transparent
              foreground: component.button.ghost.foreground.disabled
        danger:
          background: component.button.danger.background.default
          foreground: component.button.danger.foreground.default
          border: component.button.danger.border.default
          states:
            hover:
              background: component.button.danger.background.hover
              border: component.button.danger.border.hover
            pressed:
              background: component.button.danger.background.pressed
              border: component.button.danger.border.pressed
            disabled:
              background: component.button.danger.background.disabled
              foreground: component.button.danger.foreground.disabled
              border: component.button.danger.border.disabled
      reducedMotion:
        reduce:
          motion: none
web:
  package: "@stevegreco/design-system-components"
  export: DsButton
  defaultTagName: ds-button
  registration:
    export: defineButton
    supportsAliases: true
  anatomy:
    control:
      element: button
      part: button
    content:
      slot: default
      required: true
      accepts:
        - text
        - decorative-icon
        - text-and-decorative-icon
  parameters:
    action:
      attribute: type
      property: type
      values:
        activate: button
        submit: submit
        reset: reset
    fullWidth:
      attribute: full-width
    accessibleName:
      attribute: aria-label
  events:
    activate:
      event: click
      suppressedWhen: effectively-disabled
  properties:
    form:
      type: "HTMLFormElement | null"
      readonly: true
      description: The associated form, including association across the shadow boundary.
  formAssociation:
    mechanism: FACE
    fieldsetDisables: true
    submitRunsConstraintValidation: true
    resetResetsAssociatedForm: true
  focus:
    forwardsTo: control
  parts:
    button:
      description: The inner native button control.
  example: |
    <ds-button variant="primary">Save changes</ds-button>
  rationale:
    - decision: Button is form-associated.
      rationale: Submit and reset behavior must work across the shadow boundary.
