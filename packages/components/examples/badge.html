<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>&lt;ds-badge&gt; — Design System Components</title>

    <link rel="stylesheet" href="../node_modules/@stevegreco/design-system/dist/css/tokens.css" />
    <script type="module" src="../src/index.js"></script>

    <style>
      body {
        margin: 0;
        padding: var(--primitives-space-8);
        background-color: var(--semantic-color-background-default);
        color: var(--semantic-color-foreground-default);
        font-family: var(--primitives-font-sans);
      }

      h1 {
        margin: 0 0 var(--primitives-space-2);
        font-size: var(--primitives-text-2xl);
      }

      p {
        margin: 0 0 var(--primitives-space-6);
        color: var(--semantic-color-foreground-muted);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--primitives-space-3);
      }
    </style>
  </head>
  <body>
    <h1>&lt;ds-badge&gt;</h1>
    <p>A non-interactive label for metadata and status.</p>

    <div class="row">
      <ds-badge>Default</ds-badge>
      <ds-badge variant="accent">Accent</ds-badge>
      <ds-badge variant="success">Active</ds-badge>
      <ds-badge variant="danger">Failed</ds-badge>
      <ds-badge variant="warning">Pending</ds-badge>
      <ds-badge variant="info">Beta</ds-badge>
    </div>
  </body>
</html>
