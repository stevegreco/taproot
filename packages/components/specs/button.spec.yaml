specVersion: 1

name: Button
status: draft
description: Triggers an action or submits or resets a form.
tagName: ds-button

usage:
  do:
    - situation: Trigger an action in the current view.
    - situation: Submit or reset a form.
  avoid:
    - situation: Navigate to another location.
      instead: Link
      why: Links provide native navigation semantics.
    - situation: Display status or metadata.
      instead: Badge
      why: Button communicates an available action.

anatomy:
  - name: control
    element: button
    part: button
    description: Native interactive control.
  - name: content
    slot: default
    description: Action label with an optional decorative icon.

api:
  attributes:
    variant:
      property: variant
      type: enum
      values:
        primary: Highest-emphasis action.
        secondary: Supporting action.
        ghost: Low-emphasis action.
        danger: Destructive or difficult-to-reverse action.
      default: primary

    size:
      property: size
      type: enum
      values:
        sm: Small button.
        md: Medium button.
      default: md

    type:
      property: type
      type: enum
      values:
        button: Triggers an action without submitting a form.
        submit: Submits the associated form.
        reset: Resets the associated form.
      default: button

    disabled:
      property: disabled
      type: boolean
      default: false

    full-width:
      type: boolean
      default: false
      description: Fills the available inline size.

    aria-label:
      type: string
      description: Provides an accessible name when visible content is insufficient.

  properties:
    form:
      type: HTMLFormElement | null
      readonly: true
      description: The associated form, including association across the shadow boundary.

  events:
    click:
      description: Native activation event. It is suppressed while effectively disabled.

  slots:
    default:
      required: true
      accepts:
        - text
        - decorative-icon
        - text-and-decorative-icon

  parts:
    button:
      description: The inner native button control.

states:
  - default
  - hover
  - pressed
  - focus-visible
  - disabled

behavior:
  - The disabled attribute prevents activation.
  - A disabled ancestor fieldset disables the button.
  - A submit button runs native constraint validation before submitting its associated form.
  - A reset button resets its associated form.
  - Programmatic focus and blur are forwarded to the inner native control.
  - The full-width attribute makes the button fill its container.

accessibility:
  semantics: Native button.
  name: Required from visible content or aria-label.
  keyboard:
    - key: Enter
      action: Activate the button.
    - key: Space
      action: Activate the button.
  requirements:
    - Keyboard focus remains visibly indicated.
    - Icon-only buttons have an accessible name.
    - The label describes the resulting action.
    - Meaning does not depend on color alone.

tokens:
  tier: component
  namespace: component.button
  description: All visual values consume the published Button component-token contract.

decisions:
  - decision: Button is form-associated.
    rationale: Submit and reset behavior must work across the shadow boundary.
  - decision: Button has a published component-token namespace.
    rationale: Consumers need a stable customization boundary for its variants and states.
