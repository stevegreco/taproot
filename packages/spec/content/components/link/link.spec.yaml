# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.link
type: component
title: Link
summary: Use Link to navigate to another page, a location on the page, or a resource.
tags:
  - action
  - navigation
  - hyperlink
  - anchor
links:
  composes:
    - component.icon
sources:
  - title: Token tier consumption (tokens ADR 0003)
    url: packages/tokens/docs/adr/0003-token-tier-consumption.md
description: Navigates to another page, a location on the current page, or a resource.
usage:
  do:
    - Navigate to another page or resource.
    - Move to a location on the current page.
    - Point to related content from within a sentence.
  avoid:
    - situation: Trigger an action or submit a form.
      instead: component.button
      why: Buttons provide action semantics and form behavior.
    - situation: Display status or metadata.
      instead: component.badge
      why: Link communicates a destination.
    - situation: Switch between a few views of the same subject without leaving the page.
      instead: component.tabs
      why: Tabs show one view in place. A link changes the address.
anatomy:
  control:
    role: interactive-surface
    description: Owns the destination and focus.
  content:
    role: label
    description: Link text with an optional decorative icon.
parameters:
  href:
    kind: string
    description: Destination. Without it the control is not a link and cannot receive focus.
  variant:
    kind: enum
    values:
      inline: Link inside a run of text. Inherits the surrounding typography and is always underlined.
      standalone: >-
        Link on its own line or after related content. Uses label typography and is underlined on
        hover.
    examples:
      inline: token tier ADR
      standalone: View all projects
    guidance:
      inline: pattern.action-hierarchy#inline
      standalone: pattern.action-hierarchy#standalone
    default: inline
events:
  activate: Follows the link to its destination.
states:
  - hover
  - focus
  - default
rules:
  - id: text-describes-destination
    level: must
    topic: content
    statement: Use link text that names the destination, not the gesture.
    examples:
      do:
        - View billing history
        - token tier ADR
      avoid:
        - Click here
        - Learn more
  - id: choose-link-or-button
    level: should
    topic: content
    statement: Apply the action hierarchy pattern to choose between Link and Button.
    references:
      - pattern.action-hierarchy#choose-button-or-link
  - id: platform-navigation
    level: must
    topic: behavior
    statement: >-
      Activation navigates the way the platform's own links do, including every way the platform
      offers to open a destination elsewhere, such as a new tab or window.
  - id: inline-underline
    level: must
    topic: behavior
    statement: >-
      An inline link is underlined at rest, so it is distinguishable from surrounding text without
      color.
  - id: standalone-underline-on-hover
    level: should
    topic: behavior
    statement: A standalone link is underlined on hover.
  - id: no-disabled-state
    level: must
    topic: behavior
    statement: >-
      Link has no disabled state. When the destination is unavailable, render text instead of a
      link.
  - id: link-purpose
    level: must
    topic: accessibility
    statement: The purpose of the link is clear from its text, or from its text and the sentence around it.
  - id: not-color-alone
    level: must
    topic: accessibility
    statement: An inline link does not depend on color alone to be identified.
  - id: visible-focus
    level: must
    topic: accessibility
    statement: Keyboard focus remains visibly indicated.
accessibility:
  role: Link
  name: Required from the link text.
  keyboard:
    Tab: Move focus to or from the link.
    Enter: Follow the link.
tokens:
  control:
    base:
      foreground: semantic.color.foreground.brand.default
    hover:
      foreground: semantic.color.foreground.default
    focus:
      focus-ring: semantic.color.border.focus
      radius: semantic.radius.control
    variant.inline:
      font-family: inherit
      font-size: inherit
      font-weight: inherit
      line-height: inherit
      letter-spacing: inherit
    variant.standalone:
      font-family: semantic.typography.label.md.fontFamily
      font-size: semantic.typography.label.md.fontSize
      font-weight: semantic.typography.label.md.fontWeight
      line-height: semantic.typography.label.md.lineHeight
      letter-spacing: semantic.typography.label.md.letterSpacing
rationale:
  - decision: Link consumes semantic tokens directly.
    why: >-
      Tokens ADR 0003. Brand foreground is audited as text on the page background, and focus already has a
      semantic role. No component-token namespace.
  - decision: Placement is a variant, not a size.
    why: >-
      Inline and standalone links differ in typography and underline. Destination semantics are the
      same.
  - decision: The underline is not a visual mapping.
    why: >-
      Text decoration is fixed component behavior, not a token channel. The behavior rules state
      when it shows.
  - decision: Link has no visited or disabled styling.
    why: >-
      Platforms often limit visited styling to color, and no semantic visited role exists. A link with no
      destination is text.
