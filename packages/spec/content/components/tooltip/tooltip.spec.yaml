# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.tooltip
type: component
title: Tooltip
summary: Use Tooltip to show the name of an icon-only control when a person points at it or focuses it.
tags:
  - label
  - icon-only
  - hover
  - overlay
links:
  follows:
    - guideline.compose-or-propose
  related:
    - component.button
description: >-
  A short text label that appears next to an icon-only control while a person points at it or
  focuses it, and disappears when they move away or dismiss it. Its text is the control's
  accessible name, so the label people see and the name assistive technology reads are the same.
usage:
  do:
    - Name an icon-only button, such as a trash icon that deletes a row or a pencil icon that edits it.
    - Name each control in a toolbar of icon-only actions, where there is no room for text labels.
  avoid:
    - situation: Label a control that already shows its name as text.
      instead: no tooltip
      why: >-
        The visible text already names it. A tooltip repeats it and gets in the way of whatever
        sits next to the control.
    - situation: Name an icon that is not a control, such as a status symbol beside a value.
      instead: component.icon
      why: >-
        A tooltip only appears on something a person can focus. Give the icon a label, or state its
        meaning in text beside it.
    - situation: Explain the expected format of a form field, or why its value is invalid.
      instead: component.text-field
      why: >-
        The field's hint and error are always visible and are read with the field. A tooltip hides
        the information until someone goes looking for it.
    - situation: Explain why an action is disabled.
      instead: a short text near the action
      why: >-
        A disabled control cannot take focus, so keyboard users would never see a tooltip on it.
        Button's explain-disabled rule asks for visible text.
    - situation: Show content that has links, buttons, or more than a short phrase.
      instead: component.dialog
      why: >-
        A tooltip cannot be interacted with and disappears when the pointer leaves. Content a person
        has to read or act on needs a surface they open on purpose.
    - situation: Give information that people must see to complete a task.
      instead: visible text on the page
      why: >-
        Touch screens have no hover, and many people never point at a control before using it. A
        tooltip is only a reminder of what a control does.
anatomy:
  trigger:
    role: interactive-surface
    description: >-
      The supplied icon-only control that the tooltip names, such as a Button. Tooltip does not
      draw it.
  bubble:
    role: label
    description: >-
      The floating text that names the trigger. It appears beside the trigger, above other content,
      and does not take focus.
parameters:
  label:
    kind: string
    description: >-
      The text the bubble shows. It is also the trigger's accessible name, so the trigger needs no
      other name. Required.
  placement:
    kind: enum
    values:
      above: Shows the bubble above the trigger, or below it when there is no room above.
      below: Shows the bubble below the trigger, or above it when there is no room below.
    default: above
states:
  - default
  - open
rules:
  - id: label-names-trigger
    level: must
    topic: accessibility
    statement: >-
      The label is the trigger's accessible name. Assistive technology reads it once, as the name
      of the control, and does not read the bubble as separate text.
  - id: label-short
    level: should
    topic: content
    statement: >-
      Write the label as a few words that name the action or the object, with no ending
      punctuation. It is the control's name, so the same words a text button would use fit.
    examples:
      do:
        - Delete row
        - Edit profile
      avoid:
        - Click here to delete this row from the table.
        - Trash
  - id: one-trigger
    level: must
    topic: behavior
    statement: >-
      A tooltip names exactly one control, and that control is one a person can focus, such as a
      Button.
    references:
      - component.button#icon-accessible-name
  - id: opens-on-hover-and-focus
    level: must
    topic: behavior
    statement: >-
      The bubble opens when the pointer rests on the trigger for a moment, and at once when the
      trigger receives keyboard focus.
  - id: stays-while-hovered
    level: must
    topic: accessibility
    statement: >-
      The bubble stays open while the pointer is on the trigger or on the bubble, so the pointer
      can move onto the bubble without it closing.
  - id: escape-closes
    level: must
    topic: accessibility
    statement: >-
      Escape closes the bubble without moving focus or changing anything else. It stays closed
      until the pointer or focus leaves the trigger and comes back.
  - id: closes-on-leave
    level: must
    topic: behavior
    statement: >-
      The bubble closes when the pointer has left both the trigger and the bubble, when focus leaves
      the trigger, or when the trigger is activated.
  - id: not-interactive
    level: must
    topic: behavior
    statement: >-
      The bubble never takes focus and holds no links, buttons, or other controls.
  - id: stays-in-view
    level: must
    topic: behavior
    statement: >-
      The bubble appears above all other content and is not clipped by a scrolling container. When
      there is no room on the side set by placement, it moves to the opposite side, and it never
      runs past the edge of the viewport.
  - id: does-not-shift-layout
    level: must
    topic: behavior
    statement: >-
      Opening the bubble does not move or resize anything on the page. The trigger keeps its own
      size and position.
  - id: one-open
    level: should
    topic: behavior
    statement: >-
      Only one bubble is open at a time. Opening one closes any other.
accessibility:
  role: None of its own. The trigger keeps its role.
  name: Gives the trigger its accessible name from the label parameter.
  keyboard:
    Escape: Close the bubble without moving focus.
tokens:
  bubble:
    base:
      background: semantic.color.background.surface
      foreground: semantic.color.foreground.default
      border: semantic.color.border.default
      border-width: semantic.border.width
      radius: semantic.radius.control
      shadow: semantic.elevation.md
      padding-horizontal: primitives.space.2
      padding-vertical: primitives.space.1
      font-family: semantic.typography.label.sm.fontFamily
      font-size: semantic.typography.label.sm.fontSize
      font-weight: semantic.typography.label.sm.fontWeight
      line-height: semantic.typography.label.sm.lineHeight
rationale:
  - decision: Tooltip names its trigger and has no description mode.
    covers: [icon-only]
    why: >-
      Naming icon-only controls is the need the system has now, and a label tooltip keeps what
      people see and what assistive technology reads the same. A tooltip that adds supplementary
      text to a control that already has a name is a separate decision, with its own reading
      order, so it waits for a real need.
  - decision: The bubble uses the surface color with the default border and the popover elevation.
    covers: [forced-colors]
    why: >-
      The system has no inverse surface role, and adding one is a token change, not part of adding
      a component. The default border keeps the bubble's edge visible on any surface and in
      forced-colors mode, where the shadow disappears and the border takes the system text color.
      semantic.elevation.md is the role the tokens name for popovers, so no new shadow token is
      needed.
  - decision: Tooltip has one size and no density setting.
    covers: [sizes, density]
    why: >-
      The bubble holds a few words in the small label style next to a control of any size. A
      larger bubble would only mean the label is too long.
  - decision: Placement offers above and below only.
    covers: [right-to-left]
    why: >-
      Above and below fit every trigger, including controls in a row, and they read the same in
      either text direction, so nothing mirrors. Start and end placements can come later without
      changing these two.
  - decision: The bubble appears and disappears without animation.
    covers: [reduced-motion]
    why: >-
      The hover delay already keeps the bubble from flashing. With no motion there is nothing to
      reduce when the person prefers reduced motion.
  - decision: Tooltip has no disabled, selected, loading, or invalid state.
    covers: [disabled, selected, loading, invalid]
    why: >-
      Those belong to the trigger. A disabled control cannot take focus, so keyboard users would
      never see its tooltip, which is why the usage guidance sends that explanation to visible text.
  - decision: Touch has no way to open the bubble.
    why: >-
      Touch screens have no hover, and a long press is already used by the platform. The label
      still names the control for assistive technology. This is why a tooltip only names a control
      and never holds information a person needs.
  - decision: The hover delay is fixed at about a third of a second and is not a token.
    why: >-
      The delay keeps bubbles from flashing as the pointer crosses a toolbar. It is timing, not
      motion, and the motion duration tokens describe animations, so the value lives in the rules
      and the implementation.
