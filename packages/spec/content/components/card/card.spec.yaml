# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.card
type: component
title: Card
summary: Use Card to present one subject as a bounded summary, such as an item in a collection, that a person can scan and act on.
status: draft
tags:
  - surface
  - container
  - collection
links:
  follows:
    - guideline.compose-or-propose
  related:
    - component.link
description: >-
  A bounded surface that groups a title, optional media, supporting content, and optional actions
  about one subject. A card can lead to a full view of its subject through one primary
  destination.
usage:
  do:
    - Show each item in a collection of peers, such as projects, articles, or plans, so they can be scanned and compared.
    - Summarize one subject on a dashboard or overview page, with a way to open its full view.
    - Group a short summary with the one or two actions that apply to that subject.
  avoid:
    - situation: Report the outcome of an action or a condition that affects the view.
      instead: component.alert
      why: Alert carries status color and can be announced. A card is neutral content.
    - situation: Ask for a decision or hold a task that blocks the rest of the view.
      instead: component.dialog
      why: Dialog holds focus until the task ends. A card sits in the flow of the page.
    - situation: Make a large target that only triggers one action or navigates, with no content of its own.
      instead: component.button
      why: >-
        A control styled as a card hides its role. Use Button for an action, or Link for
        navigation, and let the card hold content.
    - situation: Label a status or category on an item.
      instead: component.badge
      why: Badge is a compact label. Place a Badge inside a card when the card's subject has a status.
    - situation: Draw a box around one region of a page, such as a sidebar or a form section, that is not a subject of its own.
      instead: product layout styled with semantic surface tokens
      why: >-
        The compose-or-propose guideline keeps layout chrome in product code. A card stands for a
        subject and repeats with its peers.
    - situation: Switch between related views of the same subject.
      instead: component.tabs
      why: Tabs show one view at a time in place. Cards show several subjects side by side.
anatomy:
  surface:
    role: container
    description: Bounded surface that holds every other part and sets the card apart from the page.
  media:
    role: container
    description: Optional supplied image or illustration of the subject, shown before the title.
  title:
    role: label
    description: Names the subject. When the card has a primary destination, the title leads to it.
  body:
    role: description
    description: Optional supporting content about the subject, such as a summary, metadata, or a badge.
  actions:
    role: container
    description: Optional supplied actions that apply to the subject.
