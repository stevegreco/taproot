# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.select
type: component
title: Select
summary: Use Select to choose one value from a list with a label, hint, and error.
tags:
  - form
  - input
  - dropdown
  - picker
links:
  related:
    - component.text-field
  follows:
    - pattern.form-field
    - guideline.compose-or-propose
sources:
  - title: Token tier consumption (tokens ADR 0003)
    url: packages/tokens/docs/adr/0003-token-tier-consumption.md
description: >-
  Chooses one value from a list and associates a label, optional hint, and optional error with the
  control.
usage:
  do:
    - Choose one value from a known list when space is limited.
    - Pair with Button when the choice should be submitted.
  avoid:
    - situation: Show a short list of choices for comparison.
      instead: component.radio-group
      why: Radio group keeps every choice visible.
    - situation: Choose several values or search a remote list.
      instead: Multi-select or combobox
      why: Select supports a single local choice without search.
anatomy:
  field:
    role: container
    description: Label, control, hint, and error stacked together.
  label:
    role: label
    description: Visible name for the value.
  control:
    role: interactive-surface
    description: Single-choice control and its available choices, in order.
  choice:
    role: container
    description: One choice the control offers, named by its visible text.
  group:
    role: container
    description: A labeled run of consecutive choices. Groups do not nest.
  hint:
    role: description
    description: Optional supporting guidance.
  error:
    role: description
    description: Optional message that says what to fix.
parameters:
  label:
    kind: string
    description: Visible label. This is the accessible name.
  hint:
    kind: string
    description: Supporting guidance. Included in the accessible description when set.
  error:
    kind: string
    description: >-
      What to fix. A non-empty value marks the control invalid and is included in the accessible
      description.
  name:
    kind: string
    description: Form field name. The value is submitted under this name.
  value:
    kind: string
    description: Current value. The initial value is restored when the form resets.
  disabled:
    kind: boolean
    default: false
    description: Prevents choosing. A disabled field does not submit its value.
  required:
    kind: boolean
    default: false
    description: The value must be provided before submit. Conveyed by more than color.
events:
  input: The selection changed from user interaction.
  change: The selection was committed from user interaction.
items:
  choice:
    parameters:
      label:
        kind: string
        description: Visible text of the choice, and its accessible name. Required.
      value:
        kind: string
        description: >-
          Identifies the choice and is what submits. Unique within the select; the value parameter
          selects the choice whose value it matches. An empty value on the first choice makes it a
          prompt that a required select rejects.
      disabled:
        kind: boolean
        default: false
        description: Makes this choice unavailable, while it stays listed.
  group:
    parameters:
      label:
        kind: string
        description: Visible name of the group, and its accessible name. Required.
      disabled:
        kind: boolean
        default: false
        description: Makes every choice in the group unavailable.
states:
  - disabled
  - invalid
  - hover
  - focus
  - default
rules:
  - id: named-choices
    level: must
    topic: content
    statement: Each choice has visible text and a value; unavailable choices remain identifiable but cannot be chosen.
  - id: stable-selection
    level: must
    topic: behavior
    statement: Changes to available choices preserve the current value while it remains available; otherwise selection follows platform conventions.
  - id: form-value
    extends: pattern.form-field#form-value
    statement: >-
      The selected available choice submits under the name, and reset restores the initial
      selection. Disabled choices and groups submit nothing.
  - id: forced-colors
    level: must
    topic: accessibility
    statement: >-
      Under forced colors, the control boundary and keyboard focus stay visible, and a disabled
      field stays distinguishable from an enabled one.
accessibility:
  role: Single-choice selection
  name: Required from the visible label.
  keyboard:
    Tab: Move focus to or from the control.
    Arrow keys: Move among available choices following platform conventions.
    Printable characters: Find a choice by its visible text following platform conventions.
tokens:
  field:
    base:
      gap: primitives.space.1
  label:
    base:
      foreground: semantic.color.foreground.default
      font-family: semantic.typography.label.md.fontFamily
      font-size: semantic.typography.label.md.fontSize
      font-weight: semantic.typography.label.md.fontWeight
      line-height: semantic.typography.label.md.lineHeight
      letter-spacing: semantic.typography.label.md.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  control:
    base:
      background: semantic.color.background.surface
      foreground: semantic.color.foreground.default
      border: semantic.color.border.default
      radius: semantic.radius.control
      padding-horizontal: primitives.space.3
      padding-vertical: primitives.space.2
      font-family: semantic.typography.body.md.fontFamily
      font-size: semantic.typography.body.md.fontSize
      font-weight: semantic.typography.body.md.fontWeight
      line-height: semantic.typography.body.md.lineHeight
      letter-spacing: semantic.typography.body.md.letterSpacing
    hover:
      border: semantic.color.border.strong
    focus:
      focus-ring: semantic.color.border.focus
    disabled:
      background: semantic.color.background.disabled
      foreground: semantic.color.foreground.disabled
      border: semantic.color.border.disabled
    invalid:
      border: semantic.color.border.status.danger.default
  hint:
    base:
      foreground: semantic.color.foreground.muted
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  error:
    base:
      foreground: semantic.color.foreground.status.danger.default
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
rationale:
  - decision: Choices and groups are items, and each owns its own options.
    why: >-
      Each choice carries a label, a value, and whether it is unavailable, and each group a label
      and whether all of its choices are unavailable, so they are options of the choice or group,
      not of the whole select (ADR 0004), as with Radio group's choices. The select's disabled
      parameter makes every choice unavailable at once.
  - decision: Select consumes semantic tokens directly.
    why: >-
      Tokens ADR 0003. Focus, invalid, disabled, surface, and text already have semantic roles. No
      component-token namespace.
  - decision: Invalid is a state driven by the error message.
    why: >-
      The message is the accessible signal. A variant axis would hide that the state comes from the
      error.
  - decision: Label, hint, and error belong to the field.
    why: >-
      A separate field shell does not exist yet. Association stays on this control until that shell
      lands.
  - decision: One size, no density, loading, icon-only, visited, or checked variants.
    why: The visible label names the control. Layout controls density, and editing or choosing is local until submit.
  - decision: Direction follows the surrounding text and changes do not animate.
    why: Logical layout follows right-to-left reading order. No motion needs reducing.
  - decision: High contrast uses platform colors and preserves the outline and visible focus.
    why: Color alone cannot communicate invalidity or focus; the error message and outline remain available.
  - decision: Reuse Text field's semantic roles and spacing primitives.
    why: Existing tokens cover the same label, hint, error, and control roles. No semantic spacing roles exist, so gaps and padding use spacing primitives.
  - decision: Use platform selection behavior without a custom overlay, search, or multiple selection.
    why: Platform selection preserves keyboard and touch behavior. Those other interactions need separate contracts.
