# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.icon
type: component
title: Icon
summary: Use Icon to size and color a graphic you supply, beside text or inside another component.
tags:
  - icon
  - graphic
  - media
  - glyph
  - symbol
sources:
  - title: Token tier consumption (tokens ADR 0003)
    url: packages/tokens/docs/adr/0003-token-tier-consumption.md
links:
  follows:
    - guideline.accessibility
description: >-
  Displays a graphic you supply at a consistent size, in the color of the surrounding text. It is
  decorative unless it has an accessible name.
usage:
  do:
    - Reinforce a label with a recognizable symbol, such as an icon before a button label.
    - Mark a status or category next to text that states it.
    - Convey meaning without text, when an accessible name says what the graphic means.
  avoid:
    - situation: Trigger an action with an icon alone.
      instead: component.button
      why: >-
        Icon is not a control. A button with an icon and an accessible name gives the action
        semantics and focus.
    - situation: Navigate with an icon alone.
      instead: component.link
      why: Links provide navigation semantics and focus.
    - situation: Show a photo or illustration.
      instead: an image in the surrounding page
      why: Icon is sized for symbols at text scale, not content imagery.
anatomy:
  graphic:
    role: indicator
    description: >-
      The supplied artwork, scaled to fit a square of the chosen size and painted in the current
      text color.
parameters:
  size:
    kind: enum
    values:
      inherit: Matches the surrounding text size. Use inside another component's label.
      small: Fixed small size, for dense layouts and small labels.
      medium: Fixed medium size, for icons that stand beside body text.
      large: Fixed large size, for icons that stand on their own.
    default: inherit
  accessibleName:
    kind: string
    description: >-
      What the graphic means. Without it the icon is decorative and hidden from assistive
      technology.
states:
  - default
rules:
  - id: decorative-by-default
    level: must
    topic: accessibility
    statement: An icon without an accessible name is hidden from assistive technology.
  - id: name-when-meaningful
    level: must
    topic: accessibility
    statement: >-
      Give the icon an accessible name when it conveys meaning that no nearby text states.
    examples:
      do:
        - A warning symbol beside a field value, named Warning
      avoid:
        - A warning symbol with no name and no nearby text
  - id: no-name-when-repeated
    level: should
    topic: content
    statement: >-
      Do not name an icon whose meaning repeats the text beside it. Assistive technology would
      announce it twice.
    examples:
      do:
        - A trash icon before the text Delete, with no name
      avoid:
        - A trash icon named Delete before the text Delete
  - id: name-says-meaning
    level: must
    topic: content
    statement: The accessible name says what the graphic means, not what it depicts.
    examples:
      do:
        - Warning
        - Opens in a new tab
      avoid:
        - Yellow triangle
        - Arrow icon
  - id: not-a-control
    extends: guideline.accessibility#not-a-control
    statement: Icon is not focusable and does not activate. Put it inside a Button or Link to act.
  - id: follows-text-color
    level: must
    topic: behavior
    statement: >-
      The graphic paints in the current text color, so it follows the state of the component around
      it and stays visible in forced-colors mode.
  - id: square-box
    level: must
    topic: behavior
    statement: >-
      The icon occupies a square of its size. The artwork scales to fit inside it without
      distortion.
  - id: not-color-alone
    extends: guideline.accessibility#not-color-alone
    statement: >-
      Meaning carried by an icon does not depend on its color. The symbol or its accessible name
      carries it.
accessibility:
  role: Image when named. Otherwise hidden from assistive technology.
  name: From the accessibleName parameter. None when decorative.
tokens:
  graphic:
    base:
      foreground: inherit
    size.inherit:
      size: inherit
    size.small:
      size: primitives.space.4
    size.medium:
      size: primitives.space.5
    size.large:
      size: primitives.space.6
rationale:
  - decision: Icon supplies no artwork.
    why: >-
      The system sizes and colors a graphic. Choosing an icon set is the adopter's decision, and a
      curated set can come later without changing this contract.
  - decision: Fixed sizes use spacing primitives.
    covers: [sizes]
    why: >-
      Tokens ADR 0003 allows a primitive when no semantic role exists. No semantic size role exists yet,
      and adding one is a token architecture change, not part of adding a component.
  - decision: The default size inherits the surrounding text size.
    why: >-
      Inside a Button, Badge, or Link label, the icon matches the label's type scale in every size
      and variant without a setting.
  - decision: The graphic takes the current text color, with no color parameter.
    covers: [forced-colors]
    why: >-
      Color comes from the component or text around the icon, so it follows hover, disabled, and
      status variants, and forced-colors mode, with no extra tokens.
  - decision: Icon has no interaction, disabled, loading, invalid, or selected states.
    covers: [disabled, selected, loading, invalid]
    why: It is not a control. The component around it owns those states.
  - decision: Icon has no density setting and no motion.
    covers: [density, reduced-motion]
    why: The size parameter covers density, and a static graphic has nothing to reduce.
  - decision: Icon does not mirror in right-to-left layouts.
    covers: [right-to-left]
    why: >-
      Only directional symbols, such as arrows, should mirror, and only the adopter knows which
      artwork is directional. They supply mirrored artwork where needed.
  - decision: Icon always renders without text. Its accessible name comes from the accessibleName parameter.
    covers: [icon-only]
    why: >-
      Text beside an icon belongs to the surrounding content, not to Icon. A meaningful icon takes an
      accessible name, and a decorative one has none (see decorative-by-default and name-when-meaningful).
