# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.button
type: component
title: Button
summary: Use Button to trigger an action or to submit or reset a form.
tags:
  - action
  - form
  - cta
  - destructive
links:
  composes:
    - component.icon
sources:
  - title: Token tier consumption (tokens ADR 0003)
    url: packages/tokens/docs/adr/0003-token-tier-consumption.md
description: Triggers an action or submits or resets a form.
usage:
  do:
    - Trigger an action in the current view.
    - Submit or reset a form.
  avoid:
    - situation: Navigate to another location.
      instead: component.link
      why: A link carries a destination that people can open, copy, or share.
    - situation: Display status or metadata.
      instead: component.badge
      why: Button communicates an available action.
anatomy:
  control:
    role: interactive-surface
    description: Interactive control.
  content:
    role: label
    description: Action label with an optional decorative icon.
parameters:
  variant:
    kind: enum
    values:
      primary: Highest-emphasis action.
      secondary: Supporting action.
      tertiary: Low-emphasis action.
      destructive: Destructive or difficult-to-reverse action.
    examples:
      primary: Save changes
      secondary: Cancel
      tertiary: View details
      destructive: Delete project
    guidance:
      primary: pattern.action-hierarchy#primary
      secondary: pattern.action-hierarchy#secondary
      tertiary: pattern.action-hierarchy#tertiary
      destructive: pattern.action-hierarchy#destructive
    default: primary
  size:
    kind: enum
    values:
      small: Small button.
      medium: Medium button.
    default: medium
  action:
    kind: enum
    values:
      activate: Triggers an action.
      submit: Submits the associated form.
      reset: Resets the associated form.
    default: activate
  disabled:
    kind: boolean
    default: false
  fullWidth:
    kind: boolean
    default: false
    description: Fills the available inline size.
  accessibleName:
    kind: string
    description: Accessible name when visible content is insufficient.
events:
  activate: Requests the action represented by the button.
states:
  - disabled
  - pressed
  - hover
  - focus
  - default
preferences:
  reducedMotion:
    - reduce
rules:
  - id: label-describes-result
    level: must
    topic: content
    statement: Use a concise label that describes the result.
    examples:
      do:
        - Save changes
        - Delete account
      avoid:
        - Click here
  - id: destructive-for-risky-actions
    level: must
    topic: content
    statement: Use the destructive variant only for destructive or difficult-to-reverse actions.
  - id: explain-disabled
    level: should
    topic: content
    statement: When the context does not say why an action is disabled, say why near it.
  - id: follow-action-hierarchy
    level: should
    topic: content
    statement: Apply the action hierarchy pattern when several actions appear together.
    references:
      - pattern.action-hierarchy#assign-emphasis
  - id: disabled-prevents-activation
    level: must
    topic: behavior
    statement: Disabled prevents activation.
  - id: explicit-form-action
    level: should
    topic: behavior
    statement: >-
      In a form, set action to submit or reset when the button should submit or reset. The default
      activate does neither.
  - id: form-submit-reset
    level: should
    topic: behavior
    statement: Submit submits the button's form, and reset restores that form's initial values.
    applicability: The button belongs to a form.
  - id: visible-focus
    level: must
    topic: accessibility
    statement: Keyboard focus remains visibly indicated.
  - id: icon-accessible-name
    level: must
    topic: accessibility
    statement: Icon-only buttons have an accessible name.
  - id: not-color-alone
    level: must
    topic: accessibility
    statement: Meaning does not depend on color alone.
accessibility:
  role: Button
  name: Required from visible content or accessibleName.
  keyboard:
    Tab: Move focus to or from the button.
    Enter: Activate.
    Space: Activate.
tokens:
  control:
    base:
      radius: semantic.radius.control
      gap: primitives.space.2
      font-family: semantic.typography.label.md.fontFamily
      font-size: semantic.typography.label.md.fontSize
      font-weight: semantic.typography.label.md.fontWeight
      line-height: semantic.typography.label.md.lineHeight
      letter-spacing: semantic.typography.label.md.letterSpacing
      motion-duration: primitives.duration.fast
      motion-easing: primitives.ease.out
    focus:
      focus-ring: semantic.color.border.focus
    size.medium:
      padding-horizontal: primitives.space.4
      padding-vertical: primitives.space.3
    size.small:
      padding-horizontal: primitives.space.3
      padding-vertical: primitives.space.2
    variant.primary:
      background: semantic.color.background.action.primary.default
      foreground: semantic.color.foreground.on.action.primary
      border: semantic.color.border.action.primary.default
    variant.primary + hover:
      background: semantic.color.background.action.primary.hover
      border: semantic.color.border.action.primary.hover
    variant.primary + pressed:
      background: semantic.color.background.action.primary.pressed
      border: semantic.color.border.action.primary.pressed
    variant.primary + disabled:
      background: semantic.color.background.disabled
      foreground: semantic.color.foreground.disabled
      border: semantic.color.border.disabled
    variant.secondary:
      background: semantic.color.background.action.secondary.default
      foreground: semantic.color.foreground.default
      border: semantic.color.border.default
    variant.secondary + hover:
      background: semantic.color.background.action.secondary.hover
    variant.secondary + pressed:
      background: semantic.color.background.action.secondary.pressed
    variant.secondary + disabled:
      background: transparent
      foreground: semantic.color.foreground.disabled
      border: semantic.color.border.disabled
    variant.tertiary:
      background: transparent
      foreground: semantic.color.foreground.default
      border: transparent
    variant.tertiary + hover:
      background: semantic.color.background.action.tertiary.hover
    variant.tertiary + pressed:
      background: semantic.color.background.action.tertiary.pressed
    variant.tertiary + disabled:
      background: transparent
      foreground: semantic.color.foreground.disabled
    variant.destructive:
      background: semantic.color.background.action.destructive.default
      foreground: semantic.color.foreground.on.action.destructive
      border: semantic.color.border.action.destructive.default
    variant.destructive + hover:
      background: semantic.color.background.action.destructive.hover
      border: semantic.color.border.action.destructive.hover
    variant.destructive + pressed:
      background: semantic.color.background.action.destructive.pressed
      border: semantic.color.border.action.destructive.pressed
    variant.destructive + disabled:
      background: semantic.color.background.disabled
      foreground: semantic.color.foreground.disabled
      border: semantic.color.border.disabled
    reducedMotion.reduce:
      motion: none
rationale:
  - decision: Button reads semantic tokens directly and has no component-token namespace.
    why: >-
      Its component tokens only restated the semantic tier, so they added names without adding a
      customization boundary (tokens ADR 0003).
