# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.radio-group
type: component
title: Radio group
summary: Use Radio group to choose exactly one option from a short visible list.
tags:
  - form
  - selection
links:
  follows:
    - pattern.form-field
    - guideline.compose-or-propose
    - guideline.accessibility
  related:
    - component.checkbox
description: >-
  A labeled set of mutually exclusive options with a shared hint and error. Choosing an option
  unchecks the previous one.
usage:
  do:
    - Choose one delivery method or plan from a short list.
  avoid:
    - situation: Choose any number of independent options.
      instead: component.checkbox
      why: Radio options are mutually exclusive.
    - situation: Choose from a long list.
      instead: component.select
      why: A compact picker makes a long list easier to scan.
    - situation: Switch which view of the same subject is shown, without saving a choice.
      instead: component.tabs
      why: Tabs change what is shown. A radio group records a value.
anatomy:
  field:
    role: container
    description: Group label and choices and messages.
  label:
    role: label
    description: Visible group name.
  options:
    role: container
    description: >-
      Ordered collection of the choices.
  choice:
    role: container
    description: One radio control and its visible option label.
  control:
    role: interactive-surface
    description: Circular selection control.
  indicator:
    role: indicator
    description: Dot appears inside the checked control.
  option-label:
    role: label
    description: Visible name of one option.
  hint:
    role: description
    description: Shared supporting guidance.
  error:
    role: description
    description: Shared message describing what to fix.
parameters:
  label:
    kind: string
    description: Visible accessible name of the group.
  hint:
    kind: string
    description: Supporting guidance associated with the group.
  error:
    kind: string
    description: Nonempty text marks the group invalid and blocks submission.
  name:
    kind: string
    description: Field name used for submission.
  value:
    kind: string
    description: Checked option value. Empty means no option is checked.
  disabled:
    kind: boolean
    default: false
    description: Makes all options unavailable.
  required:
    kind: boolean
    default: false
    description: Requires one enabled option before submission.
events:
  input: Selection changed from user interaction.
  change: Selection committed from user interaction.
items:
  choice:
    parameters:
      label:
        kind: string
        description: Visible name of the option, and its accessible name. Required.
      value:
        kind: string
        description: >-
          Identifies the option. Nonempty and unique within the group; the value parameter checks
          the option whose value it matches.
      disabled:
        kind: boolean
        default: false
        description: Makes this option unavailable, while the others stay available.
states:
  - default
  - hover
  - focus
  - checked
  - disabled
  - invalid
rules:
  - id: unique-options
    level: must
    topic: content
    statement: >-
      Each option has a visible label and a unique nonempty value. The group has a visible label.
  - id: exclusive-choice
    level: must
    topic: behavior
    statement: >-
      Choosing an option unchecks any other. Activating the checked option keeps it checked.
  - id: selection-events
    level: must
    topic: behavior
    statement: User selection changes report input then change. Programmatic changes report neither.
  - id: disabled-options
    level: must
    topic: behavior
    statement: >-
      Disabled options cannot be checked by pointer or keyboard. Disabled groups prevent all
      interaction.
  - id: form-value
    extends: pattern.form-field#form-value
    statement: >-
      The checked option's value submits under the group name, and nothing submits when no option is
      checked. Reset restores the initially checked option.
  - id: accessible-group
    level: must
    topic: accessibility
    statement: >-
      Associate the group label and hint and error with the options. Expose each option name and
      checked state.
  - id: keyboard-selection
    level: must
    topic: accessibility
    statement: >-
      Tab enters and leaves the group. Arrow keys move focus and the checked option between enabled
      options and wrap at either end. Space checks the focused option.
  - id: forced-colors
    extends: guideline.accessibility#forced-colors
    statement: A checked dot and visible keyboard focus remain distinguishable under forced colors.
accessibility:
  role: Radio group
  name: From the visible group label. Each option has its own visible label.
  keyboard:
    Tab: >-
      Enter or leave the group using the checked enabled option or the platform entry option when
      none is checked.
    Arrow keys: Move focus and selection between enabled options with wrapping.
    Space: Select the focused option.
tokens:
  field:
    base:
      gap: primitives.space.1
  options:
    base:
      gap: primitives.space.2
  choice:
    base:
      gap: primitives.space.2
  control:
    base:
      background: semantic.color.background.surface
      border: semantic.color.border.default
      radius: semantic.radius.pill
      size: primitives.space.4
    hover:
      border: semantic.color.border.strong
    focus:
      focus-ring: semantic.color.border.focus
    checked:
      background: semantic.color.background.action.primary.default
      border: semantic.color.border.action.primary.default
    disabled:
      background: semantic.color.background.disabled
      border: semantic.color.border.disabled
    invalid:
      border: semantic.color.border.status.danger.default
  indicator:
    base:
      foreground: semantic.color.foreground.on.action.primary
      size: primitives.space.2
    disabled:
      foreground: semantic.color.foreground.disabled
  label:
    base:
      foreground: semantic.color.foreground.default
      font-family: semantic.typography.label.md.fontFamily
      font-size: semantic.typography.label.md.fontSize
      font-weight: semantic.typography.label.md.fontWeight
      line-height: semantic.typography.label.md.lineHeight
      letter-spacing: semantic.typography.label.md.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  option-label:
    base:
      foreground: semantic.color.foreground.default
      font-family: semantic.typography.body.md.fontFamily
      font-size: semantic.typography.body.md.fontSize
      font-weight: semantic.typography.body.md.fontWeight
      line-height: semantic.typography.body.md.lineHeight
      letter-spacing: semantic.typography.body.md.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  hint:
    base:
      foreground: semantic.color.foreground.muted
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  error:
    base:
      foreground: semantic.color.foreground.status.danger.default
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
rationale:
  - decision: Choices are items, and each choice owns its label, value, and availability.
    why: >-
      Each choice carries a label, a value, and whether it is unavailable, so they are options of
      the choice, not of the whole group (ADR 0004). The group's disabled parameter makes every
      choice unavailable at once.
  - decision: One size and vertical layout with no density or icon-only option.
    why: >-
      A small circular control and visible label suit short lists. The dot is centered in the
      control. Both sizes are in the token map as spacing primitives, because no semantic size
      role exists (tokens ADR 0003). Layout around the group controls density.
  - decision: No mixed or loading state.
    why: Exactly one option can be checked and a form applies the choice later.
  - decision: No animation or reduced motion variation.
    why: Selection updates immediately.
  - decision: Option order follows the inline direction in right-to-left layouts.
    why: >-
      Labels follow their controls and directional keyboard behavior follows platform conventions.
  - decision: Consume semantic colors and typography with the semantic pill radius.
    why: Radio circles need the semantic pill radius.
  - decision: >-
      Disabled colors override checked and invalid colors while the checked dot stays visible.
    why: The group communicates availability and the checked option together.
  - decision: No visited state and spacing consumes existing primitives.
    why: >-
      Selection does not track navigation history. The system has no semantic spacing roles for
      choice rows.
  - decision: Checked and invalid borders take precedence over hover.
    why: >-
      Hover strengthens only the unchecked valid control. Checked and invalid together retain the
      checked background with the danger border.
