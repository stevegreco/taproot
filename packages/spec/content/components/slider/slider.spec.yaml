# yaml-language-server: $schema=../../../src/schema/spec-record.schema.json
id: component.slider
type: component
title: Slider
summary: Use Slider to choose one number from a continuous range when the approximate value matters more than the exact one.
tags:
  - form
  - input
  - range
links:
  follows:
    - pattern.form-field
    - guideline.compose-or-propose
    - guideline.accessibility
  related:
    - component.text-field
    - component.select
    - component.progress-bar
description: >-
  A track between a minimum and a maximum with a thumb that marks the chosen value. People drag
  the thumb or step it with the keyboard, and the current value is shown beside the label.
usage:
  do:
    - Set a level where people judge by feel and see the effect, such as volume or brightness.
    - Narrow a range filter to an approximate amount, such as a maximum price.
  avoid:
    - situation: Enter an exact number, or a number from a very large range.
      instead: component.text-field
      why: Typing is faster and more precise than dragging to one value among hundreds.
    - situation: Choose from a few named options, such as Small, Medium, and Large.
      instead: component.select
      why: Named options are choices, not points on a scale. A select names each one.
    - situation: Show progress or a measured amount people cannot change.
      instead: component.progress-bar
      why: A slider is a control. A bar that only reports a value must not look adjustable.
    - situation: Turn a single setting on or off.
      instead: component.switch
      why: Two states are a toggle, not a range.
anatomy:
  field:
    role: container
    description: Header, track, hint, and error stacked together.
  header:
    role: container
    description: Label and value on one line.
  label:
    role: label
    description: Visible name for the value.
  value:
    role: description
    description: The current value as text, at the end of the header.
  track:
    role: container
    description: The line from the minimum to the maximum.
  fill:
    role: indicator
    description: The part of the track from the minimum to the thumb.
  thumb:
    role: interactive-surface
    description: The handle people drag or step to change the value.
  hint:
    role: description
    description: Optional supporting guidance.
  error:
    role: description
    description: Optional message that says what to fix.
parameters:
  label:
    kind: string
    description: Visible label. This is the accessible name.
  hint:
    kind: string
    description: Supporting guidance. Included in the accessible description when set.
  error:
    kind: string
    description: >-
      What to fix. A non-empty value marks the slider invalid and is included in the accessible
      description.
  value:
    kind: number
    description: >-
      Current value. The value given at creation is the initial value that reset restores. Defaults
      to min.
  min:
    kind: number
    default: 0
    description: Smallest value, at the start of the track.
  max:
    kind: number
    default: 100
    description: Largest value, at the end of the track. Greater than min.
  step:
    kind: number
    default: 1
    description: >-
      Distance between the values people can choose, counted from min. The value is always min
      plus a whole number of steps.
  name:
    kind: string
    description: Form field name. The value is submitted under this name.
  disabled:
    kind: boolean
    default: false
    description: Prevents changing the value. A disabled slider does not submit its value.
events:
  input: The value changed while a person drags the thumb or presses a key. Reported for every new value.
  change: >-
    A person finished changing the value: released the thumb or the key. Reported once, and only
    when the value differs from the value before they started.
states:
  - default
  - hover
  - focus
  - dragging
  - disabled
  - invalid
rules:
  - id: visible-label
    extends: pattern.form-field#visible-label
    statement: Provide a visible label that names what the value sets, such as Volume.
  - id: value-shown
    level: must
    topic: content
    statement: >-
      Show the current value as text beside the label, and give assistive technology the same
      text. Position on the track alone does not say the value.
  - id: value-in-range
    level: must
    topic: behavior
    statement: >-
      The value is always between min and max and lands on a step. A value given outside the range
      moves to the nearest end, and a value between steps moves to the nearest step.
  - id: drag-or-press
    level: must
    topic: behavior
    statement: >-
      Dragging the thumb or pressing anywhere on the track moves the value to that point and
      reports input for each new value.
  - id: keyboard-steps
    level: must
    topic: behavior
    statement: >-
      Arrow keys move the value by one step, Page Up and Page Down by a tenth of the range rounded
      to a step, and Home and End to min and max. Each key press reports input then change.
  - id: change-on-release
    level: must
    topic: behavior
    statement: >-
      Report change once when a person releases the thumb or the key, and only when the value
      differs from the value before they started. Apply costly work, such as a new search, on
      change rather than input.
  - id: programmatic-no-events
    level: must
    topic: behavior
    statement: Setting the value from outside, or a form reset, does not report input or change.
  - id: form-value
    extends: pattern.form-field#form-value
    statement: The current number submits under the name, and reset restores the initial value.
  - id: required-blocks-submit
    waived: A slider always has a value between min and max, so it cannot be required.
  - id: required-announced
    waived: A slider always has a value between min and max, so it cannot be required.
  - id: thumb-contrast
    level: must
    topic: accessibility
    statement: >-
      The thumb and fill are visible against the track and the surface around it, so position is
      readable without the value text.
  - id: forced-colors
    extends: guideline.accessibility#forced-colors
    statement: >-
      Keep the track outline, the fill, the thumb, and keyboard focus visible under forced colors.
accessibility:
  role: Slider
  name: From the visible label.
  keyboard:
    Tab: Move focus to or from the thumb.
    Arrow Right / Arrow Up: Increase the value by one step.
    Arrow Left / Arrow Down: Decrease the value by one step.
    Page Up / Page Down: Increase or decrease by a tenth of the range.
    Home / End: Move to min or max.
tokens:
  field:
    base:
      gap: primitives.space.2
  header:
    base:
      gap: primitives.space.2
  label:
    base:
      foreground: semantic.color.foreground.default
      font-family: semantic.typography.label.md.fontFamily
      font-size: semantic.typography.label.md.fontSize
      font-weight: semantic.typography.label.md.fontWeight
      line-height: semantic.typography.label.md.lineHeight
      letter-spacing: semantic.typography.label.md.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  value:
    base:
      foreground: semantic.color.foreground.muted
      font-family: semantic.typography.body.md.fontFamily
      font-size: semantic.typography.body.md.fontSize
      font-weight: semantic.typography.body.md.fontWeight
      line-height: semantic.typography.body.md.lineHeight
      letter-spacing: semantic.typography.body.md.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  track:
    base:
      background: semantic.color.background.muted
      radius: semantic.radius.pill
      height: primitives.space.2
    disabled:
      background: semantic.color.background.disabled
  fill:
    base:
      background: semantic.color.background.action.primary.default
      radius: semantic.radius.pill
    disabled:
      background: semantic.color.border.disabled
    invalid:
      background: semantic.color.border.status.danger.default
  thumb:
    base:
      background: semantic.color.background.action.primary.default
      border: semantic.color.background.surface
      radius: semantic.radius.pill
      size: primitives.space.5
    hover:
      background: semantic.color.background.action.primary.hover
    dragging:
      background: semantic.color.background.action.primary.pressed
    focus:
      focus-ring: semantic.color.border.focus
    disabled:
      background: semantic.color.border.disabled
    invalid:
      background: semantic.color.border.status.danger.default
  hint:
    base:
      foreground: semantic.color.foreground.muted
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
    disabled:
      foreground: semantic.color.foreground.disabled
  error:
    base:
      foreground: semantic.color.foreground.status.danger.default
      font-family: semantic.typography.body.sm.fontFamily
      font-size: semantic.typography.body.sm.fontSize
      font-weight: semantic.typography.body.sm.fontWeight
      line-height: semantic.typography.body.sm.lineHeight
      letter-spacing: semantic.typography.body.sm.letterSpacing
rationale:
  - decision: One thumb, horizontal, with no tick marks.
    why: >-
      The uses in the usage section need one value along the reading direction. A two-thumb range,
      a vertical slider, and tick marks can be added when a layout needs them.
  - decision: The value text is the number in the reader's locale. There is no format parameter.
    why: >-
      Units go in the label, such as "Volume (%)" or "Maximum price (USD)". A format parameter for
      units or currency can be added when several uses need the same one.
  - decision: The value text is not editable.
    why: >-
      A slider is for approximate values. When people need an exact number, use Text field, as
      the usage section says.
  - decision: No required state.
    why: A slider always has a value, so it can never be empty.
  - decision: Disabled removes the thumb from keyboard navigation and greys every part.
    covers: [disabled]
    why: >-
      Nothing can change while disabled, so focus would only be a stop with nothing to do. The
      value text stays readable so people still see the setting.
  - decision: An error recolors the fill and thumb and always shows its message.
    covers: [invalid]
    why: >-
      A value can be wrong for reasons outside the slider, such as a budget above an account
      limit. The message carries the meaning, so the danger color is never the only signal.
  - decision: No selected, checked, or loading state.
    covers: [selected, loading]
    why: >-
      A slider holds a number, not an on or off state. Work that follows a change belongs to the
      page, which can disable the slider while it waits.
  - decision: One size, filling the width of its container.
    covers: [sizes, density]
    why: >-
      The track length comes from the layout. The thumb is large enough to grab with a pointer.
      Sizes are spacing primitives because no semantic size role exists (tokens ADR 0003).
  - decision: The label is visible and required. There is no label-free slider.
    covers: [icon-only]
    why: Position on a track does not say what it sets, for sighted people either.
  - decision: The track runs in the reading direction, so it mirrors in right-to-left layouts.
    covers: [right-to-left]
    why: Min sits at the start and max at the end. Arrow keys follow the visual direction.
  - decision: Nothing animates. The thumb and fill move with the value.
    covers: [reduced-motion]
    why: Motion would lag behind the pointer while dragging.
  - decision: In forced colors the track draws an outline, and the fill and thumb use a system color.
    covers: [forced-colors]
    why: >-
      Forced colors drop background colors, which would leave an invisible track. An outlined
      track with a solid fill and thumb keeps the position visible.
  - decision: The fill and thumb use the primary action color, not the brand color Progress bar uses.
    why: >-
      A slider is a control, and action colors say it can be changed. Progress bar uses brand
      color because it cannot.
  - decision: The invalid fill and thumb use the danger status border color.
    why: >-
      The danger status background is a pale tint meant to sit behind text, so a fill and thumb in
      it disappear against the track. The danger border color is strong in both themes, and Switch
      uses it for its invalid state too.
  - decision: The disabled fill and thumb use the disabled border color.
    why: >-
      No color token covers a disabled filled part. The disabled border color is visible against
      the disabled track and reads as unavailable, so a new token for one component is not needed.
  - decision: The thumb border uses the surface color.
    why: >-
      A ring in the surface color separates the thumb from the fill behind it, so the thumb edge
      stays visible where the two share a color.
