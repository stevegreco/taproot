packages:
  - "packages/*"
  - "apps/*"
  # Opt in: the videos app installs on its own (see apps/videos/README.md), so a normal install
  # and CI never download Remotion.
  - "!apps/videos"
allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  fsevents: false
  sharp: true
minimumReleaseAgeExclude:
  - astro@6.3.7
  - blume@1.0.4
  - blume@1.5.1
